<!-- ============================================================
  wiki.js 章番号注入スクリプト
  管理画面 → テーマ → 「HTMLヘッド注入」に貼り付ける

  ページパス末尾の数字プレフィックス (例: /spec/01_overview → 1,
  /spec/03-functions → 3) を章番号として CSS カウンタに設定する。
  wiki.js は SPA のためページ遷移を MutationObserver で監視する。
============================================================ -->
<script>
(function () {
  function applyChapterNumber() {
    var el = document.querySelector('.contents');
    if (!el) return;
    // パス末尾セグメントの先頭数字を章番号とみなす (01_xxx, 03-yyy 等)
    var seg = decodeURIComponent(location.pathname).split('/').pop() || '';
    var m = seg.match(/^0*(\d+)[-_]/);
    if (m) {
      el.style.counterReset = 'chapter ' + parseInt(m[1], 10) + ' sec2 0';
      el.classList.add('numbered');
    } else {
      el.style.counterReset = '';
      el.classList.remove('numbered');
    }
  }
  var run = function () { setTimeout(applyChapterNumber, 0); };
  window.addEventListener('DOMContentLoaded', run);
  // SPA遷移対応: DOM変化とURL変化を監視
  var lastPath = location.pathname;
  new MutationObserver(function () {
    if (location.pathname !== lastPath) {
      lastPath = location.pathname;
      run();
    } else if (document.querySelector('.contents:not(.numbered)')) {
      run();
    }
  }).observe(document.body, { childList: true, subtree: true });
})();
</script>
