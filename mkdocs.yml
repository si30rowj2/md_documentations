# ============================================================
# MkDocs 設定 (docs/ を Material テーマの静的サイトに変換)
#
# 前提・思想は wiki.js / PDF と共通:
#   - md の見出しには番号を書かない
#   - 2階層フォルダ構成。大分類 = フォルダ (03_screens 等)、
#     小分類 = ファイル (01_login.md 等)。数字プレフィックスが表示順
#   - 見出し番号は docs/assets/numbering.css + numbering.js が
#     パスの数字プレフィックス2つ (大分類/小分類) から自動注入する
#     (wiki.js の custom-css.css / head-injection.html と同じ方式)
#
# ナビゲーションは明示せず自動生成させる。フォルダ/ファイル名順に並ぶため、
# tools/renumber.ps1 で番号を振り直せばナビ順も自動で追従する。
# 大分類(フォルダ)のナビ表示名は各フォルダの .pages の title で付ける
# (awesome-pages プラグイン)。
# ============================================================

site_name: 在庫管理システム ソフトウェア仕様書
docs_dir: docs
# 生成物は site/ (下記 build コマンド参照)。.gitignore 済み。

plugins:
  - search
  - awesome-pages   # 各フォルダの .pages の title を大分類ナビ名にする

theme:
  name: material
  language: ja
  features:
    - navigation.instant   # SPA風ページ遷移 (numbering.js は document$ で対応済み)
    - navigation.top
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替

extra_css:
  - assets/numbering.css
extra_javascript:
  - assets/numbering.js

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
