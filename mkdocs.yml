# ============================================================
# MkDocs 設定 (docs/ を Material テーマの静的サイトに変換)
#
# このファイルには「見た目の設定」しか書かない。
# サイトタイトル・ナビゲーション・章番号はすべて docs.yml が唯一のソースで、
# tools/mkdocs_hook.py が読み込んで注入する。
#   → 章の順序を変える / 章を挿入するときに触るのは docs.yml だけ
#
# 番号は見出しテキストそのものに入るため、本文だけでなく
# 左ナビ・ページ内 TOC・検索結果にも表示される。
#
# プレビュー: mkdocs serve   /   ビルド: mkdocs build (site/ に出力)
# ============================================================

# site_name / nav は tools/mkdocs_hook.py が docs.yml の title / nav で上書きする。
# site_name は MkDocs の必須項目なので、値のないプレースホルダだけ置いておく
# (ここを編集しても効果はない。タイトルを変えるのは docs.yml)
site_name: docs.yml から設定
docs_dir: docs

hooks:
  - tools/mkdocs_hook.py

# docs.yml を編集したときも mkdocs serve が自動リロードするように
watch:
  - docs.yml
  - tools

plugins:
  - search

theme:
  name: material
  language: ja
  features:
    - navigation.instant   # SPA風ページ遷移
    - navigation.top
    - navigation.tracking
    - content.code.copy
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: ダークモードに切替
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切替

markdown_extensions:
  - toc:
      permalink: true
      toc_depth: 3
  - tables
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
